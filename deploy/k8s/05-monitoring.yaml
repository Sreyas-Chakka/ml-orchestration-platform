apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: mlops }
data:
  prometheus.yml: |
    global: { scrape_interval: 10s, evaluation_interval: 10s }
    rule_files: [/etc/prometheus/alerts.yml]
    scrape_configs:
      - job_name: mlops-pods
        kubernetes_sd_configs: [{ role: pod, namespaces: { names: [mlops] } }]
        relabel_configs:
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], regex: "true", action: keep }
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
# alerts.yml is created from deploy/prometheus/alerts.yml by `make k8s-up`
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: mlops }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: prometheus-sd, namespace: mlops }
rules: [{ apiGroups: [""], resources: [pods, services, endpoints], verbs: [get, list, watch] }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: prometheus-sd, namespace: mlops }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: mlops }]
roleRef: { kind: Role, name: prometheus-sd, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: mlops }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            - { name: alerts, mountPath: /etc/prometheus/alerts.yml, subPath: alerts.yml }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: alerts, configMap: { name: prometheus-alerts } }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: mlops }
spec: { selector: { app: prometheus }, ports: [{ port: 9090 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: mlops }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
          ports: [{ containerPort: 3000 }]
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: providers, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - { name: datasources, configMap: { name: grafana-datasources } }
        - { name: providers, configMap: { name: grafana-providers } }
        - { name: dashboards, configMap: { name: grafana-dashboards } }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: mlops }
spec: { selector: { app: grafana }, ports: [{ port: 3000 }] }
