apiVersion: v1
kind: ConfigMap
metadata: { name: mlops-config, namespace: mlops }
data:
  DATABASE_URL: postgresql+psycopg2://mlops:mlops@mlops-postgres:5432/mlops
  QUEUE_URL: redis://mlops-redis:6379/0
  EXECUTOR: kubernetes
  K8S_IN_CLUSTER: "true"
  K8S_NAMESPACE: mlops
  K8S_TRAINER_IMAGE: mlops-trainer:latest
  K8S_IMAGE_PULL_POLICY: IfNotPresent   # images are side-loaded with `kind load docker-image`
  K8S_ARTIFACT_PVC: mlops-artifacts
  CALLBACK_URL: http://mlops-api:8000
  ARTIFACT_DIR: /srv/.data/artifacts
  LOG_DIR: /srv/.data/logs
  MAX_CONCURRENT_RUNS: "4"
  STALL_TIMEOUT_S: "90"
  CORS_ORIGINS: http://localhost:8080
---
apiVersion: v1
kind: Secret
metadata: { name: mlops-secrets, namespace: mlops }
type: Opaque
stringData:
  JWT_SECRET: replace-me-with-a-long-random-string-before-deploying
  BOOTSTRAP_ADMIN_PASSWORD: admin123
  ANTHROPIC_API_KEY: ""   # optional: enables the Claude run analyst
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mlops-artifacts, namespace: mlops }
spec:
  # ReadWriteOnce is fine on a single-node local cluster (kind/minikube): all pods share the node.
  # On a multi-node cluster use an RWX class (NFS/EFS/Filestore) or switch artifacts to S3/GCS.
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
