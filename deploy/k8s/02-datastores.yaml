apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mlops-postgres, namespace: mlops }
spec:
  serviceName: mlops-postgres
  replicas: 1
  selector: { matchLabels: { app: mlops-postgres } }
  template:
    metadata: { labels: { app: mlops-postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: mlops }
            - { name: POSTGRES_PASSWORD, value: mlops }
            - { name: POSTGRES_DB, value: mlops }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe: { exec: { command: ["pg_isready", "-U", "mlops"] }, periodSeconds: 5 }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 2Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: mlops-postgres, namespace: mlops }
spec: { selector: { app: mlops-postgres }, ports: [{ port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mlops-redis, namespace: mlops }
spec:
  replicas: 1
  selector: { matchLabels: { app: mlops-redis } }
  template:
    metadata: { labels: { app: mlops-redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes"]
          ports: [{ containerPort: 6379 }]
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: mlops-redis, namespace: mlops }
spec: { selector: { app: mlops-redis }, ports: [{ port: 6379 }] }
