# Full stack on one machine: Postgres + Redis + API + dispatcher + dashboard + Prometheus + Grafana.
# Training runs execute as subprocesses inside the worker container (EXECUTOR=local).
# For Kubernetes-dispatched training pods, see deploy/k8s and the README.
x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://mlops:mlops@postgres:5432/mlops
  QUEUE_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string-in-production}
  ARTIFACT_DIR: /srv/.data/artifacts
  LOG_DIR: /srv/.data/logs
  EXECUTOR: local
  CALLBACK_URL: http://worker:8000
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CORS_ORIGINS: http://localhost:8080

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: mlops, POSTGRES_PASSWORD: mlops, POSTGRES_DB: mlops }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mlops"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: { <<: *backend-env, EMBEDDED_WORKER: "false" }
    volumes: [data:/srv/.data]
    ports: ["8000:8000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }

  # Dispatcher + local executor. It also serves the trainer callback API on :8000 so that
  # training subprocesses in this container can report back without crossing the network.
  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment: { <<: *backend-env, EMBEDDED_WORKER: "true", CALLBACK_URL: "http://127.0.0.1:8000" }
    volumes: [data:/srv/.data]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }

  dashboard:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

volumes: { pgdata: {}, data: {} }
